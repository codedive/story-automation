services:
  - type: web
    name: ai-story-factory-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_PROVIDER
        value: openai
      - key: DATABASE_URL
        sync: false
      - key: DUPLICATE_THRESHOLD
        value: "72"
      - key: MAX_REGENERATION_ATTEMPTS
        value: "3"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_GOOGLE_EMAIL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
